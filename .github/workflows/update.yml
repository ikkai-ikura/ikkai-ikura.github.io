name: daily-update
on:
  schedule:
    - cron: "0 17 * * *"   # 毎朝2時(JST)に開始。GitHub側は数時間遅れることがあるので、通勤時間までに終わるよう早めに置く
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
# 続けてpushしても同時に走らせない（並行すると楽天APIの1秒1回制限に当たり、最後のpushも競合して失敗する）
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "daily update"
          # 作業中に別のpush（設定の修正など）が入っても失敗しないよう、取り込んでから送る（docs は今回の生成を優先）
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
      - run: python indexnow.py
